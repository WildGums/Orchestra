name: Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      Deploy:
        description: Deploy
        required: false
        type: boolean
        default: false
  #pull_request:
    # Note: don't run on PR for security reasons
  
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-latest # Required for some (WPF) projects
    env:
      Category: 'Public'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      AzureCodeSignCertificateName: ''
      AzureCodeSignClientId: ''
      AzureCodeSignClientSecret: ''
      AzureCodeSignTenantId: ''
      AzureCodeSignVaultName: ''
      Deploy: ${{ inputs.Deploy }}
      NuGetRepositoryUrl: ''
      NuGetUser: ''
      SonarOrganization: ''
      SonarUrl: ''
      SonarToken: ''
  
    steps:
      - name: Enable Git long paths (global)
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          
      - name: Setup .NET Core
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Azure login (for Key Vault access)
        id: azure-login
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine required Key Vault secrets
        id: determine-keyvault-secrets
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          $secretVariables = @(
            @{ VariableName = 'SonarOrganization'; MaskValue = $false }
            @{ VariableName = 'SonarUrl'; MaskValue = $false }
            @{ VariableName = 'SonarToken'; MaskValue = $true }
          )

          if ($env:Deploy -eq 'true') {
            $secretVariables += @(
              @{ VariableName = 'AzureCodeSignCertificateName'; MaskValue = $true }
              @{ VariableName = 'AzureCodeSignTenantId'; MaskValue = $true }
              @{ VariableName = 'AzureCodeSignClientId'; MaskValue = $true }
              @{ VariableName = 'AzureCodeSignClientSecret'; MaskValue = $true }
            )
          }

          $secretsJson = ConvertTo-Json -InputObject $secretVariables -Compress -Depth 5 -AsArray
          Add-Content -Path $env:GITHUB_OUTPUT -Value "secrets=$secretsJson"

      - name: Retrieve secrets from Key Vault
        id: key-vault-secrets
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME || secrets.AZURE_KEYVAULT_NAME }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SECRET_VARIABLES_JSON: ${{ steps.determine-keyvault-secrets.outputs.secrets }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_KEYVAULT_NAME)) {
            throw "AZURE_KEYVAULT_NAME is not configured"
          }

          if ([string]::IsNullOrWhiteSpace($env:REPOSITORY_OWNER)) {
            throw "REPOSITORY_OWNER is not available"
          }

          Write-Output "::add-mask::$env:AZURE_KEYVAULT_NAME"

          $vaultName = $env:AZURE_KEYVAULT_NAME
          $repositoryOwner = $env:REPOSITORY_OWNER
          $secretVariables = $env:SECRET_VARIABLES_JSON | ConvertFrom-Json

          # List secrets once, then resolve/retrieve them in parallel instead of up to 3 sequential az calls per variable.
          $vaultSecretNames = az keyvault secret list --vault-name $vaultName --query "[].name" -o tsv 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to list secrets in Key Vault '$vaultName'. $($vaultSecretNames -join ' ')"
          }
          $vaultSecretNameSet = [System.Collections.Generic.HashSet[string]]::new([string[]]$vaultSecretNames, [System.StringComparer]::OrdinalIgnoreCase)

          function Resolve-SecretName {
            param(
              [Parameter(Mandatory = $true)]
              [string] $VariableName
            )

            $secretName = $VariableName -replace '_', '--'
            $candidateNames = @(
              "$repositoryOwner-$env:Category-$secretName"
              "$repositoryOwner-$secretName"
              "$secretName"
            )

            foreach ($candidateName in $candidateNames) {
              if ($vaultSecretNameSet.Contains($candidateName)) {
                return $candidateName
              }
            }

            throw "Unable to find a Key Vault secret for '$VariableName' in '$vaultName'. Tried: $($candidateNames -join ', ')"
          }

          $resolvedSecrets = foreach ($secretVariable in $secretVariables) {
            [pscustomobject]@{
              EnvName    = if ($secretVariable.EnvironmentVariableName) { $secretVariable.EnvironmentVariableName } else { $secretVariable.VariableName }
              MaskValue  = $secretVariable.MaskValue
              SecretName = Resolve-SecretName -VariableName $secretVariable.VariableName
            }
          }

          $secretResults = $resolvedSecrets | ForEach-Object -Parallel {
            $entry = $_
            $vaultName = $using:vaultName

            try {
              $secretValue = az keyvault secret show --only-show-errors --vault-name $vaultName --name $entry.SecretName --query value -o tsv 2>&1

              if ($LASTEXITCODE -ne 0) {
                throw "Unable to retrieve Key Vault secret '$($entry.SecretName)' from '$vaultName'. $($secretValue -join ' ')"
              }

              [pscustomobject]@{
                EnvName      = $entry.EnvName
                MaskValue    = $entry.MaskValue
                SecretValue  = [string]$secretValue
                ErrorMessage = $null
              }
            }
            catch {
              [pscustomobject]@{
                EnvName      = $entry.EnvName
                MaskValue    = $entry.MaskValue
                SecretValue  = $null
                ErrorMessage = $_.Exception.Message
              }
            }
          } -ThrottleLimit 8

          $failedSecrets = @($secretResults | Where-Object { $_.ErrorMessage })
          if ($failedSecrets.Count -gt 0) {
            throw ($failedSecrets.ErrorMessage -join "`n")
          }

          foreach ($secretResult in $secretResults) {
            if ($secretResult.MaskValue -and -not [string]::IsNullOrEmpty($secretResult.SecretValue)) {
              Write-Output "::add-mask::$($secretResult.SecretValue)"
            }

            Add-Content -Path $env:GITHUB_ENV -Value "$($secretResult.EnvName)=$($secretResult.SecretValue)"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "AzureCodeSignVaultName=$env:AZURE_KEYVAULT_NAME"
    
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        id: nuget-login
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NuGetUser }}
    
      # Build & test
      - name: Build and test via Cake
        id: cake-action-build-test
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && env.Deploy != 'true') }}
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        with:
          target: 'BuildAndTest'
          arguments: |
            IsCiBuild: true
            SonarOrganization: ${{ env.SonarOrganization }}
            SonarUrl: ${{ env.SonarUrl }}
            SonarProject: ${{ github.repository_owner }}_${{ github.event.repository.name }}
            SonarToken: ${{ env.SonarToken }}

      # Build & deploy
      - name: Build and deploy via Cake
        id: cake-action-build-deploy
        if: ${{ github.event_name == 'workflow_dispatch' && env.Deploy == 'true' }}
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        with:
          target: 'BuildAndDeploy'
          arguments: |
            AzureCodeSignCertificateName: ${{ env.AzureCodeSignCertificateName }}
            AzureCodeSignClientId: ${{ env.AzureCodeSignClientId }}
            AzureCodeSignClientSecret: ${{ env.AzureCodeSignClientSecret }}
            AzureCodeSignTenantId: ${{ env.AzureCodeSignTenantId }}
            AzureCodeSignVaultName: ${{ env.AzureCodeSignVaultName }}
            IsCiBuild: false
            NuGetRepositoryUrl: ${{ env.NuGetRepositoryUrl }}
            NuGetRepositoryApiKey: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
            SonarOrganization: ${{ env.SonarOrganization }}
            SonarUrl: ${{ env.SonarUrl }}
            SonarProject: ${{ github.repository_owner }}_${{ github.event.repository.name }}
            SonarToken: ${{ env.SonarToken }}
